<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Directing Template">
    <meta name="keywords" content="Directing, unica, creative, html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Zogin | Template</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" href="{{url_for('static' , filename='css/bootstrap.min.css') }}" type="text/css">
    <link rel="stylesheet" href="{{url_for('static' , filename='css/font-awesome.min.css') }}" type="text/css">
    <link rel="stylesheet" href="{{url_for('static' , filename='css/elegant-icons.css') }}" type="text/css">
    <link rel="stylesheet" href="{{url_for('static' , filename='css/nice-select.css') }}" type="text/css">
    <link rel="stylesheet" href="{{url_for('static' , filename='css/barfiller.css') }}" type="text/css">
    <link rel="stylesheet" href="{{url_for('static' , filename='css/owl.carousel.min.css') }}" type="text/css">
    <link rel="stylesheet" href="{{url_for('static' , filename='css/slicknav.min.css') }}" type="text/css">
    <link rel="stylesheet" href="{{url_for('static' , filename='css/style.css') }}" type="text/css">
</head>

<body>
    
<!-- Appoinment Section Begin -->
    <section class="appointment">
        <div class="container">
            <div class="appointment__text">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="section-title">
                            <img src="{{url_for('static' , filename='img/icon-white.png') }}" alt="icon-white.png">
                            <h2>Registrarse</h2>
                        </div>
                    </div>
                </div>
                <form action="#" class="appointment__form">
                    <div class="row">
                        <div class="col-lg-6">
                            <input type="text" placeholder="Nombre">
                        </div>
                        <div class="col-lg-6">
                            <input type="text" placeholder="Email">
                        </div>
                        <div class="col-lg-6 offset-lg-3">
                            <input type="text" placeholder="Celular">
                        </div>

                        <div class="col-lg-12 text-center">

                        <div class="row mt-4 text-center pb-4 offset-lg-2">
                            <div class="col-lg-5">
                                <button type="button" class="btn btn-primary btn-lg w-100 py-4">
                                Carrera Corta <br><br>
                                X cosa <br><br>
                                X cosa<br>
                                </button>
                            </div>
                            <div class="col-lg-5">
                                <button type="button" class="btn btn-success btn-lg w-100 py-4">
                                - Carrera Larga <br><br>
                                - Y cosa <br><br>
                                - Y cosa<br>
                                </button>
                            </div>
                        </div>

                            <textarea placeholder="mensaje"></textarea>
                            <button type="submit">Enviar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
    <!-- Appoinment Section End -->

    <!-- Js Plugins -->
    <script src="{{url_for('static' , filename='js/jquery-3.3.1.min.js') }}"></script>
    <script src="{{url_for('static' , filename='js/bootstrap.min.js') }}"></script>
    <script src="{{url_for('static' , filename='js/jquery.nice-select.min.js') }}"></script>
    <script src="{{url_for('static' , filename='js/jquery.barfiller.js') }}"></script>
    <script src="{{url_for('static' , filename='js/jquery.slicknav.js') }}"></script>
    <script src="{{url_for('static' , filename='js/owl.carousel.min.js') }}"></script>
    <script src="{{url_for('static' , filename='js/main.js') }}"></script>
</body>

</html>
